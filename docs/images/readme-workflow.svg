<style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#203d44}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:18px}.arrow{fill:none;stroke:#547e80;stroke-width:3;marker-end:url(#tip)}</style>
