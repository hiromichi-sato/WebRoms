name: Windows Package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:release
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1
      - run: node --test tests/windows-launcher.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: WebROMS-windows
          path: |
            releases/WebROMS-windows.zip
            releases/WebROMS-windows.zip.sha256
